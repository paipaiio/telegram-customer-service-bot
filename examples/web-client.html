<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForumDesk 网页客服示例</title>
<style>
body{margin:0;background:#091322;color:#ecf5ff;font:15px system-ui}.chat{max-width:520px;margin:30px auto;border:1px solid #29415f;border-radius:18px;overflow:hidden;background:#101e31}.head{padding:16px 18px;background:#173252;font-weight:700}.setup,.send{display:grid;gap:8px;padding:14px}.setup{grid-template-columns:1fr}input,button{border:1px solid #365778;border-radius:9px;padding:11px;background:#0a1727;color:#fff}button{background:#2377c9;cursor:pointer}.messages{height:380px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 12px;border-radius:13px;background:#20344d;cursor:pointer}.staff{align-self:flex-start}.customer{align-self:flex-end;background:#21659b}.quote{border-left:3px solid #72b8ee;padding:4px 7px;margin-bottom:5px;color:#b8d7ed;font-size:12px}.send{grid-template-columns:1fr auto}.replying{display:none;margin:0 14px;padding:8px 10px;background:#162a40;border-radius:8px;color:#b8d7ed}.replying.on{display:flex;justify-content:space-between}.cancel{border:0;background:transparent;padding:0;color:#fff}.hint{color:#9eb2ca;font-size:12px;padding:0 14px 12px}
</style></head><body><div class="chat"><div class="head">ForumDesk 网页客服</div><div class="setup"><input id="base" placeholder="API Base URL"><input id="conversation" placeholder="Conversation ID"><input id="token" type="password" placeholder="Visitor Token"><button id="connect">连接</button></div><div class="messages" id="messages"></div><div class="replying" id="replying"><span id="reply-label"></span><button class="cancel" id="cancel-reply">×</button></div><div class="send"><input id="text" maxlength="4000" placeholder="输入消息"><button id="send">发送</button></div><div class="hint">点击一条消息可引用回复。示例页只保存在当前内存；正式网站由后端注入会话 ID 和访客 Token。</div></div><script>
let cursor=0,timer,replyTo='';const byId=new Map(),messageData=new Map();const $=id=>document.getElementById(id);function config(){return{base:$('base').value.replace(/\/$/,''),id:$('conversation').value,token:$('token').value}}function selectReply(m){replyTo=m.id;$('reply-label').textContent=`回复：${m.text.slice(0,60)}`;$('replying').classList.add('on');$('text').focus()}function clearReply(){replyTo='';$('replying').classList.remove('on')}function render(m){if(m.event==='message_hidden'){byId.get(m.target_message_id)?.remove();byId.delete(m.target_message_id);messageData.delete(m.target_message_id);if(replyTo===m.target_message_id)clearReply();return}const el=document.createElement('div');el.className=`bubble ${m.direction}`;if(m.reply_to_message_id){const quoted=messageData.get(m.reply_to_message_id);const q=document.createElement('div');q.className='quote';q.textContent=quoted?quoted.text.slice(0,80):'引用消息';el.append(q)}const text=document.createElement('div');text.textContent=(m.staff_name?`${m.staff_name}: `:'')+m.text;el.append(text);el.onclick=()=>selectReply(m);byId.set(m.id,el);messageData.set(m.id,m);$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight}async function poll(){const c=config();if(!c.base||!c.id||!c.token)return;const r=await fetch(`${c.base}/api/v1/conversations/${c.id}/messages?after=${cursor}&limit=50`,{headers:{Authorization:`Bearer ${c.token}`}});if(!r.ok)return;const p=await r.json();p.data.forEach(render);cursor=p.meta.next_cursor}function start(){clearInterval(timer);cursor=0;$('messages').replaceChildren();byId.clear();messageData.clear();clearReply();poll();timer=setInterval(poll,2000)}$('connect').onclick=start;$('cancel-reply').onclick=clearReply;$('send').onclick=async()=>{const c=config(),text=$('text').value.trim();if(!text)return;const body={text};if(replyTo)body.reply_to_message_id=replyTo;const r=await fetch(`${c.base}/api/v1/conversations/${c.id}/messages`,{method:'POST',headers:{Authorization:`Bearer ${c.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){$('text').value='';clearReply();await poll()}};$('text').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
</script></body></html>
